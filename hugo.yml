baseURL: "https://eckodeath.netlify.app/"
title: "eckodeath.fr"
pagerSize: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minifyOutput: true

params:
  env: production
  title: Your Site Title
  description: "Le journal de Kurt Grava"
  keywords: [Blog, Portfolio, PaperMod]
  author: 
  customCSS:
    - css/custom.css
  DateFormat: "2 January 2006"
  defaultTheme: auto # dark, light, auto
  disableThemeToggle: false
  homeInfoParams:
    Title: Le journal de Kurt Grava
    Content: « Live by design, not by default » quote by Aaron Sansoni

  socialIcons: # optional
    - name: "<platform>"
      url: "<link>"
    - name: "<platform 2>"
      url: "<link2>"

  label:
    icon: "/Logo_header_final_1.png"
    iconHeight: 150
  
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: false
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableFingerprinting: true
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"

  profileMode:
    enabled: false
    title: Your Name
    subtitle: "Your short bio here"
    imageUrl: "/images/norway_1.jpg"
    imageWidth: 120
    imageHeight: 120
    buttons:
      - name: Blog
        url: https://eckodeath.netlify.app/
      - name: Archives
        url: archives
      - name: Tags
        url: tags

  socialIcons:
    - name: instagram
      url: "https://www.instagram.com/eckodeath/"
    - name: threads
      url: "https://www.threads.com/@eckodeath"
    - name: twitter
      url: "https://x.com/eckodeath"
    - name: unsplash
      url: "https://refrakt.app/eckodeath/series"


  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

menu:
  main:
    - identifier: categories
      name: Catégories
      url: /categories/
      weight: 10
    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20
    - identifier: search
      name: "🔍"
      url: /search/
      weight: 40
    - identifier: about
      name: "À propos"
      url: /about/
      weight: 30
    
    - name: Photographie
      parent: categories        # ← doit correspondre à l'identifier ci-dessus
      url: /categories/photographie/
      weight: 1

    - name: Voyages
      parent: categories
      url: /categories/voyages/
      weight: 2


outputs:
  home:
    - HTML
    - RSS
    - JSON # necessary for search

markup:
  goldmark:
    renderer:
      unsafe: true

defaultContentLanguage: fr
languageCode: fr
languages:
  fr:
    languageName: Français
    weight: 1



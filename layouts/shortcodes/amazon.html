<div style="display:flex;align-items:center;gap:20px;background:#fff;border:1px solid #e8e8e8;border-radius:12px;padding:20px;margin:32px 0;box-shadow:0 2px 12px rgba(0,0,0,0.07);max-width:560px;font-family:-apple-system,'Segoe UI',sans-serif;position:relative;overflow:hidden;">

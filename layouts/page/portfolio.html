<style>
  /* ── CASSER LE CONTENEUR PAPERMOD ── */
  .main {
    padding: 0 !important;
  }

  .post-single {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .post-header,
  .post-meta {
    display: none !important;
  }

  .post-content {
    margin: 0 !important;
    padding: 0 !important;
    max-width: 100% !important;
  }

  /* ── PAGE PLEINE LARGEUR ── */
  #portfolio-wrap {
    background: var(--theme);
    min-height: 100vh;
    width: 100vw;
    position: relative;
    left: 50%;
    margin-left: -50vw;
  }

  /* ── HEADER ── */
  .pf-header {
    padding: 64px 48px 48px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
  }

  .pf-header-left h1 {
    font-family: 'Helvetica Neue', Helvetica, sans-serif;
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 300;
    font-style: normal;
    color: var(--primary);
    line-height: 1.1;
    margin: 0 0 10px;
    letter-spacing: 0.04em;
  }

  .pf-header-left p {
    font-family: 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: var(--secondary);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0;
  }

  .pf-header-right {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }

  .pf-filter {
    font-family: 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--secondary);
    background: transparent;
    border: 1px solid var(--border);
    padding: 6px 16px;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 0;
  }

  .pf-filter:hover,
  .pf-filter.active {
    background: var(--primary);
    color: var(--theme);
    border-color: var(--primary);
  }

  /* ── MASONRY GRID (JS) ── */
  .pf-masonry {
    position: relative;
    padding: 0 4px 80px;
  }

  .pf-item {
    position: absolute;
    overflow: hidden;
    cursor: pointer;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .pf-item.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .pf-item img {
    width: 100%;
    height: auto;
    display: block;
    transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                filter 0.4s ease;
    filter: brightness(1);
  }

  .pf-item:hover img {
    transform: scale(1.02);
    filter: brightness(0.88);
  }

  /* Caption on hover */
  .pf-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 40px 20px 18px;
    background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .pf-item:hover .pf-caption { opacity: 1; }

  .pf-caption-title {
    font-family: 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 13px;
    font-weight: 400;
    font-style: normal;
    color: #fff;
    margin: 0 0 3px;
    line-height: 1.3;
  }

  .pf-caption-meta {
    font-family: 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── LIGHTBOX ── */
  .pf-lb {
    position: fixed;
    inset: 0;
    background: rgba(20,19,17,0.96);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .pf-lb.open {
    opacity: 1;
    pointer-events: all;
  }

  .pf-lb-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 92vw;
    max-height: 92vh;
    gap: 16px;
  }

  .pf-lb-content img {
    max-width: 92vw;
    max-height: 80vh;
    object-fit: contain;
    display: block;
  }

  .pf-lb-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 20px;
  }

  .pf-lb-title {
    font-family: 'Helvetica Neue', Helvetica, sans-serif;
    font-style: normal;
    font-weight: 300;
    font-size: 1rem;
    color: #e8e6e0;
  }

  .pf-lb-meta {
    font-family: 'Helvetica Neue', Helvetica, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    text-align: right;
    flex-shrink: 0;
  }

  .pf-lb-prev,
  .pf-lb-next {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: rgba(255,255,255,0.35);
    font-size: 28px;
    cursor: pointer;
    padding: 16px;
    transition: color 0.2s;
    line-height: 1;
  }

  .pf-lb-prev { left: 16px; }
  .pf-lb-next { right: 16px; }
  .pf-lb-prev:hover,
  .pf-lb-next:hover { color: rgba(255,255,255,0.9); }

  .pf-lb-close {
    position: fixed;
    top: 20px;
    right: 24px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.45);
    font-size: 28px;

  .pf-lb-counter {

let currentFilter = 'all';
let currentIndex  = 0;
let visiblePhotos = [...pfPhotos];

function filteredPhotos() {
  return currentFilter === 'all'
    ? pfPhotos
    : pfPhotos.filter(p => p.category === currentFilter);
}

function getColCount() {
  const w = window.innerWidth;
  if (w <= 520) return 1;
  if (w <= 900) return 2;
  return 3;
}

function layoutMasonry() {
  const grid = document.getElementById('pfGrid');
  const items = Array.from(grid.querySelectorAll('.pf-item'));
  if (!items.length) return;

  const gap = 4;
  const cols = getColCount();
  const totalWidth = grid.offsetWidth - gap * 2;
  const colWidth = (totalWidth - gap * (cols - 1)) / cols;
  const colHeights = new Array(cols).fill(0);

  items.forEach((item, i) => {
    // Find shortest column (left-to-right on tie)
    let minH = Infinity, col = 0;
    for (let c = 0; c < cols; c++) {
      if (colHeights[c] < minH) { minH = colHeights[c]; col = c; }
    }

    const x = gap + col * (colWidth + gap);
    const y = colHeights[col];

    item.style.width = colWidth + 'px';
    item.style.left  = x + 'px';
    item.style.top   = y + 'px';

    colHeights[col] += item.offsetHeight + gap;

    // Staggered fade-in
    setTimeout(() => item.classList.add('visible'), i * 40);
  });

  grid.style.height = Math.max(...colHeights) + 'px';
}

function renderGrid() {
  visiblePhotos = filteredPhotos();
  const grid = document.getElementById('pfGrid');
  grid.innerHTML = '';
  grid.style.height = 'auto';

  visiblePhotos.forEach((photo, i) => {
    const item = document.createElement('div');
    item.className = 'pf-item';
    item.innerHTML = `
      <img src="${photo.img}" alt="${photo.title}" loading="lazy" />
      <div class="pf-caption">
        <div class="pf-caption-title">${photo.title}</div>
        <div class="pf-caption-meta">${photo.date} &nbsp;·&nbsp; ${photo.location}</div>
      </div>`;
    item.addEventListener('click', () => {
      if (photo.url) window.open(photo.url, '_blank');
      else openLb(i);
    });
    grid.appendChild(item);
  });

  // Wait for images to load before laying out
  const imgs = grid.querySelectorAll('img');
  let loaded = 0;
  const total = imgs.length;

  function onLoad() {
    loaded++;
    if (loaded === total) layoutMasonry();
  }

  imgs.forEach(img => {
    if (img.complete) onLoad();
    else { img.addEventListener('load', onLoad); img.addEventListener('error', onLoad); }
  });

  if (total === 0) layoutMasonry();
}

window.addEventListener('resize', () => {
  const items = document.querySelectorAll('.pf-item');
  items.forEach(i => i.classList.remove('visible'));
  layoutMasonry();
});

document.querySelectorAll('.pf-filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pf-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderGrid();
  });
});

const lb        = document.getElementById('pfLb');
const lbImg     = document.getElementById('pfLbImg');
const lbTitle   = document.getElementById('pfLbTitle');
const lbMeta    = document.getElementById('pfLbMeta');
const lbCounter = document.getElementById('pfLbCounter');

function openLb(index) {
  currentIndex = index;
  updateLb();
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function updateLb() {
  const p = visiblePhotos[currentIndex];
  lbImg.src = p.img;
  lbImg.alt = p.title;
  lbTitle.textContent = p.title + (p.desc ? ' — ' + p.desc : '');
  lbMeta.innerHTML    = `${p.gear}<br>${p.date} · ${p.location}`;
  lbCounter.textContent = `${currentIndex + 1} / ${visiblePhotos.length}`;
}

function closeLb() {
  lb.classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('pfLbClose').addEventListener('click', closeLb);

document.getElementById('pfLbPrev').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + visiblePhotos.length) % visiblePhotos.length;
  updateLb();
});

document.getElementById('pfLbNext').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % visiblePhotos.length;
  updateLb();
});

lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')     closeLb();
  if (e.key === 'ArrowLeft')  { currentIndex = (currentIndex - 1 + visiblePhotos.length) % visiblePhotos.length; updateLb(); }
  if (e.key === 'ArrowRight') { currentIndex = (currentIndex + 1) % visiblePhotos.length; updateLb(); }
});

renderGrid();
</script>
